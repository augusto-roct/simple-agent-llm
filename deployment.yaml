apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-agent-llm-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simple-agent-llm
  template:
    metadata:
      labels:
        app: simple-agent-llm
    spec:
      containers:
        - name: simple-agent-llm
          image: simple-agent-llm-simple_agent_llm:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          command:
            [
              "uvicorn",
              "app.main:app",
              "--interface",
              "wsgi",
              "--host",
              "0.0.0.0",
              "--port",
              "8080",
            ]
          resources:
            limits:
              memory: "1024Mi"
              cpu: "500m"
            requests:
              memory: "512Mi"
              cpu: "250m"
